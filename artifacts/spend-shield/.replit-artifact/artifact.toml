kind = "web"
previewPath = "/"
title = "SpendShield"
version = "1.0.0"
id = "artifacts/spend-shield"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19502

[services.development]
run = "pnpm --filter @workspace/spend-shield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spend-shield", "run", "build" ]
serve = "static"
publicDir = "artifacts/spend-shield/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19502"
BASE_PATH = "/"
