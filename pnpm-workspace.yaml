# Minimum release age for npm packages — a supply-chain safety buffer.
# Requires a package version to have been published for at least 1 day
# before pnpm will install it, since malicious releases are usually caught
# and pulled within hours of publishing. Don't set this to 0.
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit pulls in an old, vulnerable esbuild loader transitively — override it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"

allowBuilds:
  esbuild: true
